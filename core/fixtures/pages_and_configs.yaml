    meta_title: Conditions générales de vente – Mi' Time, massage à Montpellier
    meta_description: 'Conditions générales de vente de Mi'' Time, salon de massage
      à Montpellier : prestations, réservations, paiements et conditions d''annulation.'
    meta_keywords: CGV
    meta_robots: null
    text: '<h1>Conditions Générales de Vente</h1><h2>PRÉAMBULE</h2><h3>I- Définitions</h3><p>Les
      termes ci-après définis ont, dans les présentes Conditions Générales de Vente
      (CGV), les significations suivantes :</p><p><strong>Offre&nbsp;:</strong> désigne
      l’ensemble des services et produits proposés par «&nbsp;Mi’&nbsp;Time&nbsp;»,
      liste non exhaustive&nbsp;: Massages – Carte Cadeau – Abonnement</p><p><strong>Client&nbsp;:</strong>
      désigne la personne qui achète une Offre, étant entendu que le Client peut ou
      non en être le Bénéficiaire selon qu’il fera un usage personnel de l’Offre ou
      non.</p><p><strong>Bénéficiaire&nbsp;:</strong> désigne la personne indiquée
      par le Client comme utilisatrice de l’Offre.</p><p><strong>Carte Cadeau&nbsp;:</strong>
      désigne le document comportant l’Offre, le lieu, le numéro de validité, la date
      de validité, le nom du bénéficiaire et le descriptif permettant de profiter
      de l’Offre.</p><p><strong>Abonnement&nbsp;:</strong> désigne un ensemble de
      soins proposés sur plusieurs séances.</p><p><strong>Prestataire&nbsp;:</strong>
      désigne la personne exécutant la prestation pour le bénéficiaire.</p><p><strong>Données
      personnelles&nbsp;:</strong> désigne toutes les informations permettant, notamment
      sur Internet, d’identifier directement ou indirectement une personne physique
      (nom, prénom, adresse électronique).</p><h3>II- Champs d''application et offres
      en ligne</h3><p>Les présentes conditions générales de vente s''appliquent, sans
      restriction ni réserve à l''ensemble des services et prestations proposés par
      «&nbsp;Mi’&nbsp;Time&nbsp;», sur son site Internet et à destination des <strong>clients
      (“Clients”)</strong> ou visiteurs. Par l’intermédiaire de son site Internet
      «&nbsp;www.mi-time.fr&nbsp;», «&nbsp;Mi’&nbsp;Time&nbsp;» offre au Client la
      possibilité d’accéder à une gamme complète de massages bien-être, à réserver
      en ligne ou directement auprès du prestataire. En conséquence, le fait pour
      une personne physique ou morale, de procéder à une réservation ou un achat le
      site Internet «&nbsp;www.mi-time.fr&nbsp;» implique acceptation pleine et entière
      des présentes conditions générales de vente. Elles sont accessibles à tout moment
      sur ce site Internet et prévaudront, le cas échéant, sur toute autre version,
      étant précisé que seule la version en vigueur lors de la réservation ou de l’achat
      du Client lui sera opposable.</p><p>Tout achat ou réservation effectués par
      le Client implique son acceptation sans réserve et son adhésion pleine et entière
      aux présentes CGV.</p><p>«&nbsp;Mi’&nbsp;Time&nbsp;» se réserve le droit de
      pouvoir modifier les présentes CGV à tout moment. Dans ce cas, les nouvelles
      conditions s’appliqueront à tout nouvel achat ou réservation, ainsi qu’à toutes
      les opérations en cours, dès la date où elles auront été portées à la connaissance
      du Client par tout moyen. Les présentes Conditions Générales de Vente sont valables
      à compter du 01/09/2025.</p><h2>ARTICLE 1 : Objet</h2><p>«&nbsp;Mi’&nbsp;Time&nbsp;»
      propose des prestations de soins corporels, massages bien-être (ci-dessus «&nbsp;Offre&nbsp;»)
      à ses clients (ci-dessus «&nbsp;Client&nbsp;»). Les présentes Conditions Générales
      de Vente (CGV) régissent les ventes de prestations de massage ainsi que les
      ventes de cartes cadeaux effectuées sur le site «&nbsp;www.mi-time.fr&nbsp;»,
      ou directement auprès du Prestataire.</p><h2>ARTICLE 2 : Conditions d’utilisation
      des offres</h2><h3>Article 2.1.</h3><p>Dans l’hypothèse où le Client ne serait
      pas Bénéficiaire de l’Offre, celui-ci doit porter à la connaissance du Bénéficiaire
      les conditions ci-dessous développées.</p><h3>Article 2.2.</h3><p>Un Bénéficiaire
      mineur ne peut être accepté.</p><h3>Article 2.3.</h3><p>La délivrance de la
      prestation interviendra après le contrôle par «&nbsp;Mi’&nbsp;Time&nbsp;» de
      la validité de l’Offre et du paiement intégral de celle-ci.</p><h3>Article 2.4.</h3><p>Seule
      la présentation de l’original de la Carte, de l’Abonnement reçu auprès du Prestataire,
      par voie postale ou imprimé depuis le courriel donne droit à une prestation.</p><h3>Article
      2.5.</h3><p>L’Offre est valable selon les dates et jours de la semaine précisées
      sur le site «&nbsp;www.mi-time.fr&nbsp;», sous réserve de disponibilité au moment
      de la demande du Client.</p><h3>Article 2.6.</h3><p>Le Client reconnaît que
      les prestations des Offres n’incluent pas le transport jusqu’au lieu de la prestation
      de l’établissement sélectionné.</p><h3>Article 2.7.</h3><p>Les photographies
      présentées sur le site internet «&nbsp;www.mi-time.fr&nbsp;» ou sur les supports
      publicitaires de «&nbsp;Mi’ &nbsp;Time&nbsp;» ne sont pas contractuelles.<br>Toute
      reproduction partielle ou entière est interdite et sera susceptible de donner
      lieu à des poursuites judiciaires.</p><h3>Article 2.8.</h3><p>En cas de non
      utilisation dans sa période de validité, de perte, de vol ou de destruction
      de l’Offre, le Client ou le Bénéficiaire ne pourra prétendre à un remboursement
      ni à une compensation de quelque nature que ce soit.</p><h3>Article 2.9.</h3><p>Dans
      le cadre de l’utilisation des Offres, le Bénéficiaire déclare bénéficier d’une
      couverture d’assurance suffisante, notamment pour la pratique des soins corporels
      et de massages bien-être. Il est rappelé au Bénéficiaire que la délivrance des
      prestations dans de bonnes conditions de sécurité ne le dispense pas d’observer
      les règles de prudence élémentaires. Le Bénéficiaire en accepte seul les risques
      en conséquence et décharge «&nbsp;Mi’&nbsp;Time&nbsp;» de toute responsabilité
      à cet égard.</p><h2>ARTICLE 3 : Modalités de réalisations des prestations</h2><p>Pour
      que les soins puissent être réalisés dans les meilleurs conditions possibles
      et que vous puissiez en tirer un maximum de satisfactions, il est nécessaire
      de respecter les points suivants.</p><h3>Article 3.1. Horaires.</h3><p>Il est
      important de respecter l’horaire de votre rendez-vous. Dans un souci de détente
      et de satisfaction optimale, nous vous demandons d’arriver 5 minutes avant le
      début de votre soin. En cas de retard, nous nous verrons dans l’obligation d’écourter
      votre prestation au prorata du retard constaté sans compensation possible.</p><h3>Article
      3.2. Modification ou annulation.</h3><p>Pour toute modification ou annulation
      de rendez-vous, le délai minimum de 48H avant votre soin est requis. Au-delà
      de ce délai, nous serons contraints de facturer la totalité de votre soin ou
      le déduire de votre Abonnement ou Carte cadeau.<br>Les arrhes ne sont pas remboursables.</p><h3>Article
      3.3. Cadre de la prestation : Massage Bien-être.</h3><p>Les massages proposés
      par «&nbsp;Mi’&nbsp;Time&nbsp;» sont des prestations de bien-être, de détente
      et de relaxation. Ils n’ont aucune visée médicale, thérapeutique ou paramédicale,
      et ne s’apparentent en aucun cas à des actes de kinésithérapie ou de massothérapie
      au sens médical du terme. Le Prestataire n’est pas professionnel de santé et
      n’effectue aucun diagnostic, traitement ou suivi médical. Toute personne présentant
      une pathologie, un problème de santé particulier ou un doute doit consulter
      son médecin traitant avant de réserver une séance.</p><h3>Article 3.4 État de
      santé.</h3><p>Avant la réalisation de soins, il est important de nous aviser
      de tout problème de santé, allergie ou blessure qui pourrait gêner le bon déroulement
      de votre soin ou provoquer des effets secondaires. En cas de doute, veuillez
      consulter votre médecin traitant avant toute réservation. Si vous avez subi
      une opération chirurgicale de moins de trois mois ou pour toute maladie systémique,
      chronique ou auto-immune, veuillez prendre l’avis de votre médecin et si besoin
      fournir un avis médical avec les précautions à prendre avant toute réservation.
      En conséquence, «&nbsp;Mi’&nbsp;Time&nbsp;» se réserve le droit de refuser à
      tout moment, un client dont l’état de santé ne serait pas compatible avec la
      réalisation d’un Massage Bien-être sur sa personne sans avis médical préalable.</p><p>«&nbsp;Mi’&nbsp;Time&nbsp;»
      ne saurait être tenu responsable de tout effet secondaire relatif à un soin
      lié à la non communication de l’état de santé du Bénéficiaire. Dans tous les
      cas, les zones présentant des brûlures, des plaies ouvertes ou tout signe d’inflammation
      ou d’infection locale et/ou transmissible ne seront pas massées et suivant la
      gravité, cela aura pour conséquence de stopper le massage sans remboursement
      possible.</p><h3>Article 3.5 Comportement au sein de l’Établissement.</h3><p>Le
      lieu où «&nbsp;Mi’&nbsp;Time&nbsp;» reçoit le Client est un univers de tranquillité,
      d’harmonie et de bien-être. Pour profiter au mieux de votre expérience, de votre
      sécurité et ne pas troubler celle des autres clients, il est interdit de fumer
      ou de faire usage de téléphone portable en dehors du mode «&nbsp;discret&nbsp;»
      ou «&nbsp;silencieux&nbsp;» ou appareil audio, de consommer des boissons ou
      de la nourriture issus de l’extérieur. Il est également interdit de venir avec
      ses animaux de compagnie. Les photos et les films sont interdits sans accord
      préalable auprès de la Prestataire.</p><h3>Article 3.6 Sécurité des Personnes
      et des biens.</h3><p>Une caméra de surveillance est installée dans la salle
      d''attente du local afin de garantir la sécurité de tous. Aucun enregistrement
      n''est effectué dans les zones privées. Vous êtes informé de cette surveillance
      dès votre première visite. Pour toute question sur la gestion des images, n''hésitez
      pas à nous contacter.</p><h3>Article 3.7. Perte ou vols d’effets personnels.</h3><p>Pour
      votre confort et votre sécurité, nous vous demandons de pas laisser vos affaires
      personnelles sans surveillance. «&nbsp;Mi’&nbsp;Time&nbsp;» ne peut être tenu
      responsable en cas de perte, de vol ou de détérioration d’objets au sein de
      l’établissement.</p><h3>Article 3.8. Mœurs.</h3><p>Sont également exclues de
      l’activité de «&nbsp;Mi’&nbsp;Time&nbsp;», toute prestation à caractère érotique
      ou sexuel. Tout comportement déplacé entraînera l’arrêt de la prestation sans
      remboursement. Tout exhibitionnisme, acte à caractère sexuel au sein de l’Établissement
      ou toute demande auprès du personnel d’actes relevant de la prostitution engendrerons
      l’expulsion immédiate des locaux et des poursuites seront engagées.</p><h2>ARTICLE
      4 : Tarif et conditions d’achat.</h2><h3>Article 4.1. Tarif</h3><p>Les tarifs
      sont indiqués en euros TTC.<br>«&nbsp;Mi’&nbsp;Time&nbsp;» se réserve le droit
      de modifier ses tarifs à tout moment, l’Offre sera facturée au tarif en vigueur
      au moment de la commande.<br>Le paiement est exigible immédiatement à la commande,
      par carte bancaire ou tout autre moyen proposé sur le site.</p><h3>Article 4.2.
      Achat</h3><p>Les achats en ligne se font via le site internet «&nbsp;www.mi-time.fr&nbsp;».<br>Pour
      les prestations, la réservation d’un créneau est obligatoire via le système
      de réservation en ligne ou par contact téléphonique au 0783390680 ou en direct
      auprès de la prestataire.<br>Pour les cartes cadeaux, la commande est confirmée
      après réception du paiement.</p><h3>Article 4.3. Livraison et modalités des
      cartes cadeaux</h3><p>Les cartes cadeaux sont disponibles :</p><ul><li>En version
      dématérialisée, envoyée par e-mail au format PDF à l’adresse fournie par le
      Client au moment de la commande.</li><li>En version papier, envoyée par voie
      postale à l’adresse indiquée par le Client lors de la commande (option à sélectionner
      lors du processus d’achat).</li><li>Les cartes cadeaux physiques sont à retirer
      directement au salon en réservant un horaire de retrait par téléphone ou par
      mail après confirmation par le prestataire.</li></ul><p>L’envoi postal est effectué
      sous un délai de 2 à 3 jours ouvrés après réception du paiement. Des frais de
      livraison peuvent s’appliquer, clairement indiqués lors de la commande.</p><p>Le
      Prestataire ne pourra être tenu responsable en cas de :</p><ul><li>retard d’acheminement
      imputable au transporteur.</li><li>erreur ou omission dans l’adresse fournie
      par le Client.</li><li>perte ou vol du courrier après remise au service postal.</li></ul><p>Il
      appartient au Client de vérifier soigneusement l’adresse d’expédition qu’il
      fournit au prestataire.<br>Les cartes cadeaux et abonnements sont non nominatifs.
      Le client peut céder sa carte cadeau à une autre personne à tout moment.</p><h3>Article
      4.3. Utilisation des cartes cadeaux</h3><p>Les cartes cadeaux sont valables
      pour une durée de 12 mois à compter de la date d’achat.<br>Elles sont <strong>non
      remboursables</strong> et <strong>non échangeables contre de l''argent</strong>.<br>En
      cas de perte, elles ne peuvent être ni remplacées ni remboursées.<br>Les cartes
      cadeaux sont utilisables uniquement pour les prestations proposées sur le site.</p><h3>Article
      4.4. Conditions d''annulation et de report</h3><p>Toute annulation ou report
      doit être signalé au minimum 24h avant le rendez-vous prévu.<br>En cas d’annulation
      tardive ou de non-présentation de la carte cadeau, la prestation pourra être
      facturée ou la carte cadeau considérée comme utilisée.</p><h3>Article 4.5. Droit
      de rétractation</h3><p>Conformément à l’article L221-28 du Code de la consommation,
      le droit de rétractation ne s’applique pas aux prestations de services pleinement
      exécutées avant la fin du délai de rétractation.<br>Pour les cartes cadeaux
      envoyées par voie électronique, le droit de rétractation ne s’applique pas une
      fois le code de la carte utilisé ou si le client a expressément renoncé à ce
      droit.</p><p>Le Client exerçant ce droit dans les conditions prévues au présent
      article en termes de délai et de modalités, pourra obtenir, au choix :</p><ul><li>un
      avoir d’un montant égal au prix des Offres retournées pour une durée de 1 an
      à la date d’émission de l’avoir, utilisable uniquement auprès de «&nbsp;Mi’&nbsp;Time&nbsp;».</li><li>un
      remboursement de l’Offre.</li></ul><h3>Article 4.6. PREUVE D’ACHAT OU DE RÉSERVATION/ARCHIVAGE</h3><p>Le
      Client est expressément informé que, sauf erreur manifeste dont il doit apporter
      la preuve, les données conservées dans les bases de données de «&nbsp;Mi’&nbsp;Time&nbsp;»
      ont force probante quant aux achats ou réservations passés.</p><p>Les données
      sur support informatique ou électronique conservées régulièrement constituent
      des preuves recevables et opposables dans les mêmes termes et avec la même force
      probante que tout document qui serait reçu et conservé par écrit.</p><h3>Article
      4.6. Réclamations</h3><p>Toute réclamation par le Client doit être adressée
      au Prestataire.</p>'
