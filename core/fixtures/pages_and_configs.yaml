  fields:
    name: Politique de confidentialité
    pub_date: 2026-08-25 16:59:16.491282+00:00
    edit_date: 2026-08-25 16:59:16.491295+00:00
    meta_title: Politique de confidentialité – Mi' Time
    meta_description: Découvrez comment Mi' Time collecte, utilise et protège vos
      données personnelles, en conformité avec le RGPD. Vos droits expliqués en toute
      transparence.
    meta_keywords: null
    meta_robots: null
    text: '<h1>Responsable du traitement</h1><p>Le responsable du traitement des données
      personnelles collectées sur le site est :</p><p><strong>Mi'' Time </strong>géré
      par Mireille Cazorla</p><p>Numéro de contact : 07.83.39.06.80<br>Email de contact
      : <a href="mailto:reservation@mi-time.fr">reservation@mi-time.fr</a></p><h2>Données
      collectées</h2><p>Les données personnelles suivantes peuvent être collectées
      via le site :</p><ul><li><strong>Nom</strong></li><li><strong>Adresse e-mail</strong></li></ul><p>Ces
      données sont collectées lors de la prise de rendez-vous via un <strong>formulaire
      intégré à Calendly</strong>.</p><p>Dans le cadre des paiements en ligne, certaines
      données peuvent également être collectées et traitées par la plateforme <strong>Stripe</strong>,
      notamment l’adresse e-mail fournie au moment de l’achat, afin de permettre l’envoi
      d’un e-mail de confirmation /et d''un email contenant la carte cadeau au format
      .pdf s''il s''agit d''un achat de carte cadeau.</p><h2>Finalités du traitement</h2><p>Les
      données collectées sont utilisées pour les finalités suivantes :</p><ul><li><strong>Gestion
      des rendez-vous</strong> (via Calendly)</li><li><strong>Envoi d’e-mails de confirmation</strong>
      liés aux paiements (via Stripe)</li><li><strong>Envoi d''emails </strong>contenant
      la carte cadeau achetée en ligne<strong> </strong>(via Stripe)</li><li><strong>Communication
      avec le client</strong> en cas de besoin explicite</li></ul><p>Aucune donnée
      n’est utilisée à des fins de prospection commerciale sans consentement préalable.</p><h2>Base
      légale du traitement</h2><p>Le traitement des données repose sur :</p><ul><li>L’<strong>exécution
      d’un contrat</strong> (prise de rendez-vous, paiement d’une prestation)</li><li>Le
      <strong>consentement</strong> de la personne concernée, lorsque cela est requis
      (ex. : newsletter)</li></ul><h2>Destinataires des données</h2><p>Les données
      peuvent être transmises aux prestataires suivants, dans le cadre de leurs services
      :</p><ul><li><strong>Calendly</strong> : pour la gestion des rendez-vous</li><li><strong>Stripe</strong>
      : pour la gestion des paiements en ligne</li></ul><p>Ces prestataires sont susceptibles
      de transférer des données en dehors de l’Union européenne, mais assurent des
      garanties conformes au RGPD (clauses contractuelles types, etc.).</p><h2>Durée
      de conservation des données</h2><p>Les données personnelles sont conservées
      :</p><ul><li><strong>Jusqu’à 3 ans maximum</strong> après le dernier contact
      pour les données de contact (nom, e-mail)</li><li><strong>Durée légale applicable</strong>
      pour les données de facturation ou de paiement (obligations comptables)</li></ul><h2>Droits
      des personnes concernées</h2><p>Conformément au Règlement Général sur la Protection
      des Données (RGPD), vous disposez des droits suivants sur vos données personnelles
      :</p><ul><li>Droit d’accès</li><li>Droit de rectification</li><li>Droit d’opposition</li><li>Droit
      à l’effacement</li><li>Droit à la limitation du traitement</li><li>Droit à la
      portabilité des données</li></ul><p>Vous pouvez exercer vos droits en envoyant
      un e-mail à : <a href="mailto:reservation@mi-time.fr">reservation@mi-time.fr</a></p>'
    text2: <p>&nbsp;</p>
    text3: <p>&nbsp;</p>
