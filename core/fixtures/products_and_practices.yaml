    text1: '<p><span style="color:#7FBAB4;"><strong>Pour qui&nbsp;?</strong></span>
      Idéal pour toute personne en quête d’une détente rapide et efficace, sans avoir
      besoin de se dévêtir complètement ni de mobiliser tout le corps. Il s’adresse
      particulièrement à ceux et celles qui manquent de temps mais souhaitent relâcher
      les tensions du quotidien. Ceux et celles qui souhaitent découvrir un soin doux
      et confortable. Il convient aussi bien aux adultes actifs, qu’aux seniors. C’est
      aussi le plus accessible pour un premier massage bien-être.</p><p><span style="color:#7FBAB4;"><strong>Quelles
      zones&nbsp;?</strong></span> De base, le cuir chevelu, les mains et les pieds.
      Il peut concerner aussi le visage, la nuque, les bras. Voir options</p><p>Offrez-vous
      une parenthèse de bien-être avec ce massage de 30 minutes qui agit en profondeur
      sur les zones-clés du corps : la tête, les mains et les pieds. Inspiré du massage
      en étoile, ce soin relaxant stimule les points réflexes pour activer le système
      parasympathique. Le corps passe en mode repos. Le rythme cardiaque ralentit,
      la respiration se calme, les tensions s’apaisent. C’est à ce moment-là que le
      corps peut vraiment lâcher prise et retrouver son équilibre. Idéal pour une
      pause dans la journée, ce massage express procure une sensation immédiate de
      légèreté et de sérénité, sans mobiliser tout le corps. Un moment court, mais
      intensément régénérant.</p><p><span style="color:#7FBAB4;"><strong>Options&nbsp;:</strong></span></p><p>-
      si vous ne voulez pas d’huile dans les cheveux, le massage crânien peut se pratiquer
      à sec.<br>- si vous n’aimez pas les pieds, on peut remplacer par le massage
      du visage ou descendre sur la nuque en remplacement. Pensez à venir démaquiller
      si vous voulez le visage.<br>- si vous n’aimez pas les cheveux et la tête, le
      massage des pieds sera plus long.</p>'
