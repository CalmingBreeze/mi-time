    priority: 1
    highlighted: false
    text1: '<p><span style="color:#7FBAB4;"><strong>Pour qui&nbsp;?</strong></span>
      Pour les futures mamans tout au long de cette période unique où la vie grandit
      en vous. Il n’y a pas de contre-indication au massage bien-être prénatal, sauf
      avis contraire de votre médecin.</p><p><span style="color:#7FBAB4;"><strong>Quelles
      zones&nbsp;?</strong></span> Venez profiter d’un <strong>massage complet</strong>
      de la tête aux pieds ! A l’exception, du ventre.</p><p><span style="color:#7FBAB4;"><strong>Comment
      ça se passe&nbsp;?</strong></span> Le massage commence sur le côté afin de pouvoir
      masser le dos, ensuite vous vous allongerez. Le massage est réalisé dans une
      <strong>position confortable</strong>&nbsp;: allongée sur le dos avec un coussin
      sous la tête et un autre sous les genoux. <strong>Pas d''huile essentielle</strong>
      pour ce massage. Grâce à des gestes enveloppants et adaptés à chaque stade de
      la grossesse, ce soin soulage les tensions du dos, allège les jambes et apaise
      le mental. Idéal pour vivre sa grossesse en toute sérénité, le massage prénatal
      offre un véritable cocon de douceur, un moment suspendu, dédié à la future maman
      et à son bébé. Il est connu pour diminuer le stress. Nous nous accordons ensemble
      sur la pression afin que ce moment soit le plus privilégié pour vous. Certaines
      femmes enceintes ont des douleurs dont elles veulent être soulagées (épaules,
      lombaires, jambes lourdes…) les autres préféreront un massage relaxant et/ou
      plus doux. C’est à votre convenance. Ce massage procure un profond sentiment
      de détente et de <strong>connexion avec bébé</strong>. Souvent le bébé interagit
      pendant le massage, et lui aussi profite des hormones de relaxation sécrétées
      par la maman. Ce massage spécial grossesse est donc bien un moment de partage
      entre la maman et le bébé. Dans un espace calme et sécurisé, j’accompagne la
      femme enceinte avec bienveillance et écoute.</p><p><span style="color:#7FBAB4;"><strong>Options&nbsp;:</strong></span></p><p>-
      si vous n’aimez pas qu’on vous touche les pieds, pas de problème j’enlève cette
      partie.<br>- si vous ne voulez pas d’huile dans les cheveux, le massage crânien
      peut se faire à sec.</p>'
